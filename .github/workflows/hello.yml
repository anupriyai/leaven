name: Hello Workflow

on:
  workflow_dispatch:
    inputs:
      name:
        description: Who should we greet?
        required: false
        default: Open Project PM
        type: string

permissions:
  contents: read

jobs:
  say-hello:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Print greeting
        env:
          GREETING_NAME: ${{ inputs.name }}
        run: echo "Hello, $GREETING_NAME!"

      - name: Show workflow information
        run: |
          echo "Repository: $GITHUB_REPOSITORY"
          echo "Branch: $GITHUB_REF_NAME"
          echo "Triggered by: $GITHUB_ACTOR"
